<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>パソコンバトル - 自作PC＆AI競技シミュレーション</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 9:16 Portrait Frame Safe Against Mobile Chrome Bars */
  #game-shell {
    position: relative;
    width: min(100vw, calc(100dvh * 9 / 16));
    height: min(100dvh, calc(100vw * 16 / 9));
    max-width: 100vw;
    max-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(56, 189, 248, 0.24);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
  }

  @media (max-width: 520px) {
    #game-shell {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
  }

  .keycap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.62rem;
    font-weight: 800;
    padding: 1px 4px;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.92);
    color: #38bdf8;
    border: 1px solid rgba(56, 189, 248, 0.55);
    margin-left: 3px;
    line-height: 1.15;
    vertical-align: middle;
  }

  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.92) translateY(8px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes flashFade {
    0% { opacity: 0.75; }
    100% { opacity: 0; }
  }
  @keyframes sparkPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.35); }
    50% { box-shadow: 0 0 22px rgba(250, 204, 21, 0.75); }
  }

  .anim-idle { animation: floatIdle 3s ease-in-out infinite; }
  .anim-pop { animation: popIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .anim-arena { animation: sparkPulse 1.6s ease-in-out infinite; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 4px; }
</style>
</head>
<body>

<div id="game-shell">
  <canvas id="fx-canvas" class="pointer-events-none absolute inset-0 z-50 w-full h-full"></canvas>
  <div id="flash-overlay" class="pointer-events-none absolute inset-0 z-40 bg-white opacity-0"></div>

  <!-- Top Status Bar -->
  <header id="hud-header" class="hidden relative z-30 bg-slate-900/95 border-b border-slate-700/80 px-2.5 py-1.5 text-slate-100 shrink-0">
    <div class="flex items-center justify-between text-[11px] font-extrabold">
      <div class="flex items-center gap-1.5">
        <span id="hud-date" class="px-2 py-0.5 rounded-md bg-indigo-950 border border-indigo-500/50 text-indigo-200">2027年1月1週</span>
        <span id="hud-age" class="text-slate-300">次郎(40歳)</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span id="hud-money" class="px-2 py-0.5 rounded-md bg-amber-500/20 border border-amber-400/50 text-amber-300 font-black">¥100,000</span>
        <button type="button" onclick="AudioSys.toggleMute()" class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-600 text-[10px]" title="BGM/SE切替">
          <span id="mute-icon">🔊</span><span class="keycap">M</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Viewport -->
  <main id="main-view" class="relative flex-1 w-full overflow-hidden flex flex-col"></main>

  <!-- Bottom Navigation Bar -->
  <nav id="bottom-nav" class="hidden relative z-30 bg-slate-950 border-t border-slate-800 px-1.5 py-1 grid grid-cols-5 gap-1 shrink-0">
    <button type="button" id="nav-home" onclick="App.setTab('home')" class="nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-[10px] font-black bg-slate-800 text-slate-300">
      <span>🏠 部屋</span><span class="keycap mt-0.5">1</span>
    </button>
    <button type="button" id="nav-build" onclick="App.setTab('build')" class="nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-[10px] font-black bg-slate-800 text-slate-300">
      <span>🔧 自作</span><span class="keycap mt-0.5">2</span>
    </button>
    <button type="button" id="nav-shop" onclick="App.setTab('shop')" class="nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-[10px] font-black bg-slate-800 text-slate-300">
      <span>🛒 通販</span><span class="keycap mt-0.5">3</span>
    </button>
    <button type="button" id="nav-flea" onclick="App.setTab('flea')" class="nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-[10px] font-black bg-slate-800 text-slate-300">
      <span>📦 出品</span><span class="keycap mt-0.5">4</span>
    </button>
    <button type="button" id="nav-battle" onclick="App.setTab('battle')" class="nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-[10px] font-black bg-slate-800 text-slate-300">
      <span>⚡ 大会</span><span class="keycap mt-0.5">5</span>
    </button>
  </nav>

  <!-- Custom Modal Dialog (Never uses alert() or confirm()) -->
  <div id="modal-backdrop" class="hidden absolute inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-xs bg-slate-900 border-2 border-sky-400/70 rounded-2xl p-4 shadow-2xl anim-pop text-slate-100">
      <h3 id="modal-title" class="text-sm font-black text-sky-300 mb-1.5">確認</h3>
      <div id="modal-content" class="text-xs leading-relaxed text-slate-200 mb-4 max-h-60 overflow-y-auto"></div>
      <div id="modal-buttons" class="flex flex-wrap gap-2 justify-end"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   1. WEB AUDIO BGM & SOUND EFFECT SYSTEM
============================================================================ */
const AudioSys = (() => {
  let ctx = null;
  let muted = false;
  let bgmTimer = null;
  let activeTrack = null;
  let step = 0;

  const tracks = {
    room: {
      ms: 340,
      type: 'triangle',
      seq: [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23]
    },
    shop: {
      ms: 250,
      type: 'square',
      seq: [392.00, 493.88, 587.33, 659.25, 587.33, 493.88, 440.00, 493.88]
    },
    arena: {
      ms: 155,
      type: 'sawtooth',
      seq: [220.00, 277.18, 329.63, 440.00, 329.63, 277.18, 246.94, 369.99]
    },
    adv: {
      ms: 420,
      type: 'sine',
      seq: [329.63, 392.00, 493.88, 440.00, 392.00, 329.63, 293.66, 329.63]
    }
  };

  function init() {
    try {
      if (!ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) ctx = new AudioCtx();
      }
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    } catch (e) {}
  }

  function tone(freq, dur, type = 'sine', vol = 0.06, delay = 0) {
    if (muted || !ctx || freq <= 0) return;
    try {
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(0.02, dur));
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + Math.max(0.03, dur + 0.02));
    } catch (e) {}
  }

  function playBgm(name) {
    if (activeTrack === name && bgmTimer) return;
    stopBgm();
    activeTrack = name;
    step = 0;
    const tr = tracks[name];
    if (!tr) return;
    bgmTimer = setInterval(() => {
      if (muted) return;
      const f = tr.seq[step % tr.seq.length];
      tone(f, (tr.ms / 1000) * 0.85, tr.type, name === 'arena' ? 0.032 : 0.042);
      step++;
    }, tr.ms);
  }

  function stopBgm() {
    if (bgmTimer) {
      clearInterval(bgmTimer);
      bgmTimer = null;
    }
    activeTrack = null;
  }

  function se(kind) {
    if (muted) return;
    init();
    switch (kind) {
      case 'click': tone(640, 0.06, 'triangle', 0.08); break;
      case 'blip':  tone(480 + Math.random() * 140, 0.03, 'sine', 0.035); break;
      case 'buy':   tone(587.3, 0.09, 'triangle', 0.1, 0); tone(880, 0.18, 'triangle', 0.12, 0.07); break;
      case 'build': tone(330, 0.08, 'square', 0.07, 0); tone(440, 0.08, 'square', 0.07, 0.06); tone(660, 0.16, 'triangle', 0.1, 0.12); break;
      case 'zap':   tone(190 + Math.random() * 160, 0.09, 'sawtooth', 0.07); break;
      case 'break': tone(150, 0.22, 'sawtooth', 0.13, 0); tone(95, 0.32, 'square', 0.13, 0.12); break;
      case 'win':   [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, 0.22, 'triangle', 0.11, i * 0.09)); break;
      case 'lose':  [349.2, 311.1, 277.2, 220].forEach((f, i) => tone(f, 0.24, 'sawtooth', 0.08, i * 0.14)); break;
      case 'week':  tone(440, 0.08, 'sine', 0.07, 0); tone(554.4, 0.12, 'sine', 0.07, 0.06); break;
      default:      tone(520, 0.05, 'sine', 0.05); break;
    }
  }

  function toggleMute() {
    muted = !muted;
    const el = document.getElementById('mute-icon');
    if (el) el.textContent = muted ? '🔇' : '🔊';
    if (!muted) se('click');
  }

  return { init, playBgm, stopBgm, se, toggleMute };
})();

/* ============================================================================
   2. PARTICLE & FLASH VISUAL EFFECTS
============================================================================ */
const FX = (() => {
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let list = [];
  let active = false;

  function resize() {
    if (!canvas.parentElement) return;
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(r.width));
    canvas.height = Math.max(1, Math.floor(r.height));
  }
  window.addEventListener('resize', resize);

  function confetti() {
    resize();
    for (let i = 0; i < 65; i++) {
      list.push({
        x: Math.random() * canvas.width,
        y: -15 - Math.random() * 100,
        vx: (Math.random() - 0.5) * 2.4,
        vy: 2.2 + Math.random() * 3.4,
        sz: 5 + Math.random() * 4,
        c: ['#fbbf24', '#38bdf8', '#f43f5e', '#a855f7', '#34d399'][i % 5],
        life: 1
      });
    }
    if (!active) tick();
  }

  function tick() {
    active = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    list.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.13;
      p.life -= 0.017;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz * 0.7);
      ctx.restore();
    });
    list = list.filter(p => p.life > 0);
    if (list.length > 0) {
      requestAnimationFrame(tick);
    } else {
      active = false;
    }
  }

  function flash(color = '#ffffff') {
    const el = document.getElementById('flash-overlay');
    if (!el) return;
    el.style.backgroundColor = color;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'flashFade 0.32s ease-out forwards';
  }

  return { confetti, flash };
})();

    <rect x="86" y="64" width="26" height="16" rx="4" fill="rgba(255,255,255,0.22)" stroke="#0f172a" stroke-width="2.4"/>
    <line x1="74" y1="71" x2="86" y2="71" stroke="#0f172a" stroke-width="2.4"/>
    ${happy
      ? '<path d="M 54 73 Q 61 66 68 73" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/><path d="M 92 73 Q 99 66 106 73" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>'
      : '<circle cx="61" cy="72" r="3.4" fill="#0f172a"/><circle cx="99" cy="72" r="3.4" fill="#0f172a"/><circle cx="62.2" cy="70.8" r="1.1" fill="#fff"/><circle cx="100.2" cy="70.8" r="1.1" fill="#fff"/>'}

function svgPartIcon(cat, tier = 1, broken = false, size = 42) {

    ? { main: '#475569', hi: '#94a3b8', glow: '#ef4444' }
    : tier >= 5
    ? { main: '#a855f7', hi: '#f0abfc', glow: '#e879f9' }
    : tier >= 4
    ? { main: '#f59e0b', hi: '#fde047', glow: '#fbbf24' }
    : tier >= 3
    ? { main: '#0ea5e9', hi: '#7dd3fc', glow: '#38bdf8' }
    : tier >= 2

    ? `<path d="M 14 14 L 30 30 L 24 38 L 48 52 M 46 14 L 32 28" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>`

  return `<svg viewBox="0 0 64 64" width="${size}" height="${size}" class="shrink-0">${shape}${crack}</svg>`;
}

function svgAssembledPC(pc, size = 110) {
  const st = pc.status || { ok: false, brokenCount: 0 };
  const ready = st.ok;
  const hasBroken = st.brokenCount > 0;
  const glow = hasBroken ? '#ef4444' : ready ? '#38bdf8' : '#64748b';
  const tier = pc.maxTier || 1;
  const rgb = tier >= 4 ? '#f43f5e' : tier >= 3 ? '#38bdf8' : '#34d399';

  return `
  <svg viewBox="0 0 120 120" width="${size}" height="${size}" class="overflow-visible">
    <rect x="26" y="10" width="68" height="98" rx="8" fill="#0f172a" stroke="${glow}" stroke-width="3"/>
    <rect x="33" y="18" width="54" height="72" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    ${ready ? `
      <circle cx="48" cy="34" r="9" fill="none" stroke="${rgb}" stroke-width="2.5"/>
      <circle cx="48" cy="56" r="9" fill="none" stroke="${rgb}" stroke-width="2.5"/>

      <circle cx="72" cy="35" r="7" fill="#38bdf8" opacity="0.7"/>
    ` : `
      <text x="60" y="56" text-anchor="middle" fill="${hasBroken ? '#f87171' : '#94a3b8'}" font-size="11" font-weight="900">

function getScaledRanks(year = 2027) {
  const yearsElapsed = Math.max(0, Math.min(10, year - 2027));
  return BASE_RANKS.map(r => {
    const eraFactor = 1 + yearsElapsed * r.eraScale;
    const minBench = Math.round((r.baseMinBench * eraFactor) / 500) * 500;
    const prizeScale = 1 + yearsElapsed * 0.04;
    const prizes = r.prizes.map(p => Math.round((p * prizeScale) / 500) * 500);
    return {
      ...r,
      minBench,
      prizes,
      eraFactor
    };
  });
}

  function showModal(title, htmlContent, buttons = []) {
    const backdrop = document.getElementById('modal-backdrop');
    const titleEl = document.getElementById('modal-title');
    const contentEl = document.getElementById('modal-content');
    const btnWrap = document.getElementById('modal-buttons');
    if (!backdrop || !titleEl || !contentEl || !btnWrap) return;

    titleEl.textContent = title;
    contentEl.innerHTML = htmlContent;
    btnWrap.innerHTML = '';

    const list = buttons.length > 0
      ? buttons
      : [{ label: '閉じる', cls: 'px-3 py-2 rounded-xl text-xs font-bold bg-sky-500 text-slate-950' }];

    list.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = b.cls || 'px-3 py-2 rounded-xl text-xs font-bold bg-slate-700 text-white';
      btn.textContent = b.label;
      btn.addEventListener('click', () => {
        AudioSys.se('click');
        closeModal();

      });
      btnWrap.appendChild(btn);
    });

    backdrop.classList.remove('hidden');

  function startAdv(lines, onComplete = null) {
    if (!lines || lines.length === 0) {
      if (typeof onComplete === 'function') onComplete();
      return;
    }
    advMode = true;
    advQueue = lines;
    advIdx = 0;
    advDoneCb = onComplete;
    document.getElementById('bottom-nav').classList.add('hidden');
    AudioSys.playBgm('adv');
    showAdvLine();
  }

  function showAdvLine() {
    if (advTimer) {
      clearInterval(advTimer);
      advTimer = null;
    }
    const line = advQueue[advIdx];
    if (!line) {
      endAdv();
      return;
    }

    advFull = line.text || '';
    advDone = false;
    let charPos = 0;

    const main = document.getElementById('main-view');
    main.innerHTML = `
      <div onclick="App.nextAdv()" class="flex-1 flex flex-col justify-between p-3 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 text-slate-100 cursor-pointer">

          <button type="button" onclick="event.stopPropagation(); App.skipAdv()" class="px-2 py-0.5 rounded bg-slate-800 border border-slate-600 text-[10px] text-slate-200">
            スキップ <span class="keycap">S</span>
          </button>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center my-1">
          <div class="anim-idle">${svgJiro(line.mood || 'normal', 150)}</div>
        </div>

        <div onclick="event.stopPropagation(); App.nextAdv()" class="bg-slate-900/95 border-2 border-sky-400/70 rounded-2xl p-3 shadow-xl">
          <div class="text-xs font-black text-amber-300 mb-1">${line.speaker || '次郎'}</div>
          <p id="adv-text" class="text-xs leading-relaxed text-slate-100 min-h-[58px]"></p>
          <div class="mt-2 flex items-center justify-end text-[10px] text-sky-300 font-bold">
            <span id="adv-prompt">タップ / Enter で次へ</span><span class="keycap">Enter</span>
          </div>
        </div>
      </div>
    `;

    const textEl = document.getElementById('adv-text');
    advTimer = setInterval(() => {
      charPos++;
      if (textEl) textEl.textContent = advFull.slice(0, charPos);
      if (charPos % 4 === 0) AudioSys.se('blip');
      if (charPos >= advFull.length) {
        clearInterval(advTimer);
        advTimer = null;
        advDone = true;
      }
    }, 22);
  }

  function nextAdv() {
    if (!advMode) return;
    if (!advDone) {
      if (advTimer) {
        clearInterval(advTimer);
        advTimer = null;
      }
      const textEl = document.getElementById('adv-text');
      if (textEl) textEl.textContent = advFull;
      advDone = true;
      return;
    }
    AudioSys.se('click');
    advIdx++;
    if (advIdx >= advQueue.length) {
      endAdv();
    } else {
      showAdvLine();
    }
  }

  function skipAdv() {
    if (!advMode) return;
    if (advTimer) {
      clearInterval(advTimer);
      advTimer = null;
    }
    AudioSys.se('click');
    endAdv();
  }

  function endAdv() {
    if (advTimer) {
      clearInterval(advTimer);
      advTimer = null;
    }
    advMode = false;
    const cb = advDoneCb;
    advDoneCb = null;
    if (typeof cb === 'function') {
      cb();
    } else if (state) {
      renderApp();
    } else {
      renderTitle();
    }
  }

  /* ---------------------- PART & PC EVALUATION ---------------------- */
  function getSpec(specId) {
    return CATALOG.find(x => x.id === specId) || CATALOG[0];
  }

  function makePartInstance(specId, condition = 'new', customDurRatio = null) {
    const spec = getSpec(specId);
    const maxDur = spec.dur;
    let dur = maxDur;
    if (spec.cat === 'os') {
      dur = 999;
    } else if (condition === 'used') {
      const ratio = customDurRatio !== null ? customDurRatio : (0.52 + Math.random() * 0.38);
      dur = Math.max(8, Math.round(maxDur * ratio));
    } else if (condition === 'junk') {
      dur = Math.random() < 0.65 ? 0 : Math.max(1, Math.round(maxDur * (0.08 + Math.random() * 0.22)));
    }
    return {
      uid: state.nextUid++,
      specId,
      dur,
      maxDur,
      condition
    };
  }

  function evaluatePC(pc) {
    const p = pc.parts || {};
    const required = ['cpu', 'cooler', 'mobo', 'ram', 'gpu', 'ssd', 'psu', 'case', 'os'];
    const missing = required.filter(k => !p[k]);
    const issues = [];
    let bench = 0;
    let totalWatt = 0;
    let supplyWatt = 0;
    let brokenCount = 0;
    let maxTier = 1;

    required.forEach(k => {
      const item = p[k];
      if (!item) return;
      const spec = getSpec(item.specId);
      if (!spec) return;
      if (spec.tier > maxTier) maxTier = spec.tier;
      if (item.dur <= 0 && spec.cat !== 'os') {
        brokenCount++;
        issues.push(`${spec.name}が破損(耐久0)`);
      } else {
        bench += spec.bench;
      }
      totalWatt += (spec.watt || 0);
      if (spec.cat === 'psu') supplyWatt = spec.supply || 0;
    });

    if (missing.length > 0) {
      const labels = missing.map(k => PART_CATEGORIES.find(c => c.key === k).label).join('・');
      issues.push(`未装着: ${labels}`);
    }
    if (p.cpu && p.mobo) {
      const cs = getSpec(p.cpu.specId).socket;
      const ms = getSpec(p.mobo.specId).socket;
      if (cs !== ms) issues.push(`ソケット不一致(${cs} ≠ ${ms})`);
    }
    if (p.mobo && p.ram) {
      const mr = getSpec(p.mobo.specId).ramType;
      const rr = getSpec(p.ram.specId).ramType;
      if (mr !== rr) issues.push(`メモリ規格不一致(${mr} ≠ ${rr})`);
    }
    if (p.psu && totalWatt > supplyWatt) {
      issues.push(`電源容量不足(消費${totalWatt}W > 供給${supplyWatt}W)`);
    }

    const ok = issues.length === 0;
    pc.status = { ok, bench, totalWatt, supplyWatt, brokenCount, issues };
    pc.maxTier = maxTier;
    return pc.status;
  }

  function createAutoCompleteBuild(maxTier, condition) {
    const avail = CATALOG.filter(s => s.year <= state.year && s.tier <= maxTier);
    const pickBest = (cat, filterFn = () => true) => {
      const list = avail.filter(s => s.cat === cat && filterFn(s));
      return list[list.length - 1] || CATALOG.find(s => s.cat === cat);
    };

    const cpu = pickBest('cpu');
    const mobo = pickBest('mobo', m => m.socket === cpu.socket) || pickBest('mobo');
    const ram = pickBest('ram', r => r.ramType === mobo.ramType) || pickBest('ram');
    const gpu = pickBest('gpu');
    const cooler = pickBest('cooler');
    const ssd = pickBest('ssd');
    const pcCase = pickBest('case');
    const os = pickBest('os');
    const needWatt = cpu.watt + gpu.watt + mobo.watt + ram.watt + cooler.watt + ssd.watt + pcCase.watt;
    const psu = avail.find(s => s.cat === 'psu' && s.supply >= needWatt) || pickBest('psu');

    const durRatio = condition === 'new' ? 1 : (0.62 + Math.random() * 0.28);
    return [cpu, cooler, mobo, ram, gpu, ssd, psu, pcCase, os].map(s => ({
      specId: s.id,
      condition,
      durRatio
    }));
  }

  /* ==========================================================================
     SOCKET-CONSISTENT BUILD GENERATOR
     Ensures CPU socket == Mobo socket, Mobo ramType == RAM ramType,
     and PSU supply >= totalWatt for every valid preset build.
  ========================================================================== */
  function pickByRank(list, rankRatio = 0.5) {
    if (!list || list.length === 0) return null;
    const idx = Math.min(list.length - 1, Math.max(0, Math.floor(rankRatio * list.length)));
    return list[idx];
  }

  function buildDistinctPreset(persona, profileKey, condition = 'used') {
    const avail = CATALOG.filter(s => s.year <= state.year);
    const byCat = (cat) => avail.filter(s => s.cat === cat).sort((a, b) => a.bench - b.bench || a.price - b.price);

    const cpus = byCat('cpu');
    const coolers = byCat('cooler');
    const mobos = byCat('mobo');
    const rams = byCat('ram');
    const gpus = byCat('gpu');
    const ssds = byCat('ssd');
    const psus = byCat('psu').slice().sort((a, b) => (a.supply || 0) - (b.supply || 0) || a.bench - b.bench);
    const cases = byCat('case');
    const oss = byCat('os');

    const jitter = () => (Math.random() - 0.5) * 0.12;
    let cpu, mobo, ram, gpu, cooler, ssd, pcCase, os;

    if (profileKey === 'cheap_starter') {
      cpu = pickByRank(cpus, 0.0 + Math.random() * 0.16);
      mobo = mobos.find(m => m.socket === cpu.socket) || pickByRank(mobos, 0.0);
      ram = rams.find(r => r.ramType === mobo.ramType) || pickByRank(rams, 0.0);
      gpu = pickByRank(gpus, 0.0 + Math.random() * 0.15);
      cooler = pickByRank(coolers, 0.0);
      ssd = pickByRank(ssds, 0.0 + Math.random() * 0.2);
      pcCase = pickByRank(cases, 0.0 + Math.random() * 0.2);
      os = pickByRank(oss, 0.0);
    } else if (profileKey === 'office_compact') {
      cpu = pickByRank(cpus, 0.2 + jitter());
      mobo = mobos.find(m => m.socket === cpu.socket) || pickByRank(mobos, 0.2);
      ram = rams.find(r => r.ramType === mobo.ramType) || pickByRank(rams, 0.25);
      gpu = pickByRank(gpus, 0.08 + Math.random() * 0.14);
      cooler = pickByRank(coolers, 0.18 + Math.random() * 0.22);
      ssd = pickByRank(ssds, 0.35 + Math.random() * 0.3);
      pcCase = pickByRank(cases, 0.1 + Math.random() * 0.25);
      os = pickByRank(oss, 0.25);
    } else if (profileKey === 'cospa_mid') {
      cpu = pickByRank(cpus, 0.35 + jitter());
      mobo = mobos.find(m => m.socket === cpu.socket) || pickByRank(mobos, 0.35);
      ram = rams.find(r => r.ramType === mobo.ramType) || pickByRank(rams, 0.4 + jitter());
      gpu = pickByRank(gpus, 0.38 + jitter());
      cooler = pickByRank(coolers, 0.28 + jitter());
      ssd = pickByRank(ssds, 0.3 + jitter());
      pcCase = pickByRank(cases, 0.25 + jitter());
      os = pickByRank(oss, 0.25);
    } else if (profileKey === 'ai_compute') {
      cpu = cpus[cpus.length - 1];
      mobo = mobos.find(m => m.socket === cpu.socket) || mobos[mobos.length - 1];
      ram = rams.filter(r => r.ramType === mobo.ramType).pop() || rams[rams.length - 1];
      gpu = gpus[gpus.length - 1];
      cooler = pickByRank(coolers, 0.55 + Math.random() * 0.45);
      ssd = pickByRank(ssds, 0.75 + Math.random() * 0.25);
      pcCase = pickByRank(cases, 0.45 + Math.random() * 0.4);
      os = oss[oss.length - 1];
    } else if (profileKey === 'tough_quiet') {
      cpu = pickByRank(cpus, 0.55 + jitter());
      mobo = mobos.find(m => m.socket === cpu.socket) || pickByRank(mobos, 0.55);
      ram = rams.filter(r => r.ramType === mobo.ramType).pop() || pickByRank(rams, 0.55);
      gpu = pickByRank(gpus, 0.5 + jitter());
      cooler = coolers[coolers.length - 1];
      ssd = pickByRank(ssds, 0.55 + jitter());
      pcCase = cases[cases.length - 1];
      os = pickByRank(oss, 0.55);
    } else if (profileKey === 'odd_unbalanced') {
      const flip = Math.random() < 0.5;
      cpu = pickByRank(cpus, flip ? 0.1 + Math.random() * 0.2 : 0.55 + Math.random() * 0.25);
      mobo = mobos.find(m => m.socket === cpu.socket) || pickByRank(mobos, 0.2);
      ram = rams.filter(r => r.ramType === mobo.ramType).pop() || pickByRank(rams, 0.15 + Math.random() * 0.45);
      gpu = pickByRank(gpus, flip ? 0.5 + Math.random() * 0.3 : 0.05 + Math.random() * 0.2);
      cooler = pickByRank(coolers, 0.0 + Math.random() * 0.45);
      ssd = pickByRank(ssds, 0.1 + Math.random() * 0.5);
      pcCase = pickByRank(cases, 0.0 + Math.random() * 0.5);
      os = pickByRank(oss, Math.random() < 0.4 ? 0.0 : 0.35);
    } else {
      cpu = pickByRank(cpus, 0.72 + jitter());
      mobo = mobos.find(m => m.socket === cpu.socket) || pickByRank(mobos, 0.7);
      ram = rams.filter(r => r.ramType === mobo.ramType).pop() || pickByRank(rams, 0.75 + jitter());
      gpu = pickByRank(gpus, 0.72 + jitter());
      cooler = pickByRank(coolers, 0.65 + jitter());
      ssd = pickByRank(ssds, 0.65 + jitter());
      pcCase = pickByRank(cases, 0.65 + jitter());
      os = pickByRank(oss, 0.75);
    }

    const needWatt = cpu.watt + gpu.watt + mobo.watt + ram.watt + cooler.watt + ssd.watt + pcCase.watt;
    const extraHeadroom = (profileKey === 'tough_quiet' || profileKey === 'ai_compute') ? 220 : 80;
    const psu = psus.find(p => (p.supply || 0) >= needWatt + extraHeadroom)
      || psus.find(p => (p.supply || 0) >= needWatt)
      || psus[psus.length - 1];

    const list = [cpu, cooler, mobo, ram, gpu, ssd, psu, pcCase, os];
    return list.map(sp => {
      let cond = condition;
      let durRatio = 1;
      if (sp.cat === 'os') {
        cond = 'new';
        durRatio = 1;
      } else if (condition === 'used') {
        if (persona === 'tough_quiet') {
          durRatio = 0.82 + Math.random() * 0.16;
        } else if (persona === 'odd_unbalanced') {
          durRatio = 0.45 + Math.random() * 0.42;
        } else {
          durRatio = 0.62 + Math.random() * 0.28;
        }
      }
      return { specId: sp.id, condition: cond, durRatio };
    });
  }

  function estimateBuildBench(partsList) {
    return partsList.reduce((sum, p) => {
      const sp = getSpec(p.specId);
      const broken = p.condition === 'junk' && (p.durRatio ?? 0) <= 0.05;
      return sum + (broken ? 0 : sp.bench);
    }, 0);
  }

  function setComparePcIdx(idx) {
    AudioSys.se('click');
    const parsed = parseInt(idx, 10);
    if (!isNaN(parsed) && state && state.pcs[parsed]) {
      comparePcIdx = parsed;
      selectedPcIdx = parsed;
    }
    renderApp();
  }

  function renderComparePcBar(label = '比較対象の所持PC') {
    if (!state || !state.pcs || state.pcs.length === 0) return '';
    const refPc = getComparePC();
    const refSt = refPc ? evaluatePC(refPc) : null;
    const opts = state.pcs.map((p, i) => {
      const s = evaluatePC(p);
      return `<option value="${i}" ${i === comparePcIdx ? 'selected' : ''}>${p.name} (ベンチ:${s.bench.toLocaleString()})</option>`;
    }).join('');
    return `
      <div class="p-2 rounded-xl bg-slate-900/95 border border-sky-500/40 flex items-center justify-between gap-2 text-[11px] shrink-0">
        <span class="font-black text-sky-300 shrink-0">🔍 ${label}:</span>
        <select onchange="App.setComparePcIdx(this.value)" class="flex-1 min-w-0 bg-slate-950 text-white border border-slate-600 rounded-lg px-2 py-1 text-[11px] font-bold">
          ${opts}
        </select>
        ${refSt ? `<span class="text-[10px] text-slate-300 shrink-0">消費${refSt.totalWatt}W/電${refSt.supplyWatt}W</span>` : ''}
      </div>
    `;
  }

  function analyzeCandidatePart(spec, condition = 'new', refPc = null) {
    const targetPc = refPc || getComparePC();
    const partsMap = targetPc ? targetPc.parts : {};
    const currentItem = partsMap ? partsMap[spec.cat] : null;
    const currentSpec = currentItem ? getSpec(currentItem.specId) : null;

    const warnings = [];
    const notes = [];

    if (spec.cat === 'cpu') {
      const mbItem = partsMap ? partsMap.mobo : null;
      if (mbItem) {
        const mbSp = getSpec(mbItem.specId);
        if (mbSp.socket && spec.socket && mbSp.socket !== spec.socket) {
          warnings.push(`ソケット不一致！比較PCのマザボ「${mbSp.name}」は【${mbSp.socket}】用ですが、このCPUは【${spec.socket}】用です。`);
        } else if (mbSp.socket && spec.socket) {
          notes.push(`ソケット一致 (${spec.socket})`);
        }
      } else {
        notes.push(`CPUソケット: ${spec.socket}`);
      }
    }

    if (spec.cat === 'mobo') {
      const cpuItem = partsMap ? partsMap.cpu : null;
      if (cpuItem) {
        const cpuSp = getSpec(cpuItem.specId);
        if (cpuSp.socket && spec.socket && cpuSp.socket !== spec.socket) {
          warnings.push(`ソケット不一致！比較PCのCPU「${cpuSp.name}」は【${cpuSp.socket}】ですが、このマザボは【${spec.socket}】です。`);
        } else if (cpuSp.socket && spec.socket) {
          notes.push(`CPUソケット一致 (${spec.socket})`);
        }
      }
      const ramItem = partsMap ? partsMap.ram : null;
      if (ramItem) {
        const ramSp = getSpec(ramItem.specId);
        if (ramSp.ramType && spec.ramType && ramSp.ramType !== spec.ramType) {
          warnings.push(`メモリ規格不一致！比較PCのメモリ「${ramSp.name}」は【${ramSp.ramType}】ですが、このマザボは【${spec.ramType}】対応です。`);
        } else if (ramSp.ramType && spec.ramType) {
          notes.push(`メモリ規格一致 (${spec.ramType})`);
        }
      }
    }

    if (spec.cat === 'ram') {
      const mbItem = partsMap ? partsMap.mobo : null;
      if (mbItem) {
        const mbSp = getSpec(mbItem.specId);
        if (mbSp.ramType && spec.ramType && mbSp.ramType !== spec.ramType) {
          warnings.push(`メモリ規格不一致！比較PCのマザボ「${mbSp.name}」は【${mbSp.ramType}】用ですが、このメモリは【${spec.ramType}】です。`);
        } else if (mbSp.ramType && spec.ramType) {
          notes.push(`マザボとメモリ規格一致 (${spec.ramType})`);
        }
      }
    }

    if (spec.cat === 'psu' && targetPc) {
      const st = evaluatePC(targetPc);
      const newSupply = spec.supply || 0;
      if (newSupply < st.totalWatt) {
        warnings.push(`電源容量不足！比較PCの推定消費電力は【${st.totalWatt}W】ですが、この電源は【${newSupply}W】しかありません。`);
      } else {
        notes.push(`電源余裕: +${newSupply - st.totalWatt}W (${newSupply}W / 消費${st.totalWatt}W)`);
      }
    } else if ((spec.watt || 0) > 0 && targetPc) {
      const st = evaluatePC(targetPc);
      const oldWatt = currentSpec ? (currentSpec.watt || 0) : 0;
      const projWatt = Math.max(0, st.totalWatt - oldWatt + (spec.watt || 0));
      if (st.supplyWatt > 0 && projWatt > st.supplyWatt) {
        warnings.push(`電源容量オーバー注意！交換すると推定消費【${projWatt}W】となり、電源【${st.supplyWatt}W】を超えます。`);
      } else if (st.supplyWatt > 0) {
        notes.push(`交換後推定消費: ${projWatt}W / 電源${st.supplyWatt}W`);
      }
    }

    if (condition === 'junk') {
      warnings.push('ジャンク/現状品のため、破損（耐久0）や初期不良のリスクが高いです。');
    }

    let deltaVerdict = 'NEW';
    let deltaText = '未装着スロットに追加';
    let deltaColor = 'bg-sky-500/20 text-sky-200 border-sky-400/50';

    if (currentSpec) {
      const diff = spec.bench - currentSpec.bench;
      const diffStr = diff > 0 ? `+${diff.toLocaleString()}` : diff.toLocaleString();
      if (diff > 150) {
        deltaVerdict = 'UPGRADE';
        deltaText = `▲ 強化 (ベンチ ${diffStr} / 今: ${currentSpec.name})`;
        deltaColor = 'bg-emerald-500/20 text-emerald-200 border-emerald-400/60';
      } else if (diff < -150) {
        deltaVerdict = 'DOWNGRADE';
        deltaText = `▼ 性能低下 (ベンチ ${diffStr} / 今: ${currentSpec.name})`;
        deltaColor = 'bg-amber-500/20 text-amber-200 border-amber-400/60';
      } else {
        deltaVerdict = 'SIDEGRADE';
        deltaText = `＝ 同等クラス (ベンチ ${diffStr} / 今: ${currentSpec.name})`;
        deltaColor = 'bg-slate-700/80 text-slate-200 border-slate-500/60';
      }
    }

    return {
      currentSpec,
      warnings,
      notes,
      deltaVerdict,
      deltaText,
      deltaColor,
      hasWarning: warnings.length > 0
    };
  }

  function renderPartComparisonBlock(spec, condition = 'new', durRatio = 1, refPc = null) {
    const info = analyzeCandidatePart(spec, condition, refPc);
    const condLabel = spec.cat === 'os'
      ? 'OSソフト'
      : condition === 'new'
      ? '新品'
      : condition === 'junk'
      ? 'ジャンク(破損大)'
      : `中古(耐久目安 約${Math.round((durRatio ?? 0.75) * 100)}%)`;

    const specTag = spec.socket
      ? `ソケット:${spec.socket}`
      : spec.ramType
      ? `メモリ:${spec.ramType}`
      : spec.supply
      ? `出力:${spec.supply}W`
      : `消費:${spec.watt || 0}W`;

    const warnHtml = info.warnings.map(w => `
      <div class="mt-1 px-2 py-1 rounded bg-rose-950/90 border border-rose-500/80 text-[10px] font-black text-rose-200 leading-snug">
        ⚠ ${w}
      </div>
    `).join('');

    const noteHtml = info.notes.map(n => `
      <span class="px-1.5 py-0.5 rounded bg-slate-900/90 text-[9px] text-cyan-200 border border-slate-700">${n}</span>
    `).join('');

    return `
      <div class="mt-1.5 p-2 rounded-xl bg-slate-900/85 border border-slate-700/90 text-[10px]">
        <div class="flex flex-wrap items-center justify-between gap-1">
          <span class="px-1.5 py-0.5 rounded border font-black ${info.deltaColor}">${info.deltaText}</span>
          <span class="text-slate-300 font-bold">${condLabel} ・ ベンチ+${spec.bench.toLocaleString()} ・ ${specTag} ・ 最大耐久${spec.dur}</span>
        </div>
        ${noteHtml ? `<div class="mt-1 flex flex-wrap gap-1">${noteHtml}</div>` : ''}
        ${warnHtml}
      </div>
    `;
  }

  function renderBundleBreakdownHtml(partsList, refPc = null) {
    const targetPc = refPc || getComparePC();
    const totalBench = partsList.reduce((acc, p) => {
      const sp = getSpec(p.specId);
      const isBroken = p.condition === 'junk' && (p.durRatio ?? 0) <= 0.05;
      return acc + (isBroken ? 0 : sp.bench);
    }, 0);
    const totalWatt = partsList.reduce((acc, p) => acc + (getSpec(p.specId).watt || 0), 0);
    const psuPart = partsList.find(p => getSpec(p.specId).cat === 'psu');
    const bundleSupply = psuPart ? (getSpec(psuPart.specId).supply || 0) : (targetPc ? evaluatePC(targetPc).supplyWatt : 0);

    const cpuInBundle = partsList.find(p => getSpec(p.specId).cat === 'cpu');
    const moboInBundle = partsList.find(p => getSpec(p.specId).cat === 'mobo');
    const ramInBundle = partsList.find(p => getSpec(p.specId).cat === 'ram');
    const internalWarnings = [];

    if (cpuInBundle && moboInBundle) {
      const cSp = getSpec(cpuInBundle.specId);
      const mSp = getSpec(moboInBundle.specId);
      if (cSp.socket !== mSp.socket) {
        internalWarnings.push(`セット内ソケット不一致: CPU(${cSp.socket}) と マザボ(${mSp.socket}) が合いません！`);
      }
    }
    if (moboInBundle && ramInBundle) {
      const mSp = getSpec(moboInBundle.specId);
      const rSp = getSpec(ramInBundle.specId);
      if (mSp.ramType !== rSp.ramType) {
        internalWarnings.push(`セット内メモリ不一致: マザボ(${mSp.ramType}) と メモリ(${rSp.ramType}) が合いません！`);
      }
    }
    if (bundleSupply > 0 && totalWatt > bundleSupply) {
      internalWarnings.push(`セット内電力注意: 消費${totalWatt}W ＞ 電源${bundleSupply}W`);
    }

    const rows = partsList.map(p => {
      const sp = getSpec(p.specId);
      const catLabel = (PART_CATEGORIES.find(c => c.key === sp.cat) || { label: sp.cat }).label;
      const comp = analyzeCandidatePart(sp, p.condition || 'used', targetPc);
      const condShort = sp.cat === 'os'
        ? 'OS'
        : p.condition === 'new'
        ? '新品'
        : p.condition === 'junk'
        ? '💥ジャンク'
        : `中古(約${Math.round((p.durRatio ?? 0.75) * 100)}%)`;

      const badge = comp.hasWarning
        ? `<span class="px-1.5 py-0.5 rounded bg-rose-600 text-white text-[9px] font-black">⚠要注意</span>`
        : comp.deltaVerdict === 'UPGRADE'
        ? `<span class="px-1.5 py-0.5 rounded bg-emerald-500 text-slate-950 text-[9px] font-black">▲強化</span>`
        : comp.deltaVerdict === 'DOWNGRADE'
        ? `<span class="px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 text-[9px] font-black">▼低下</span>`
        : comp.deltaVerdict === 'SIDEGRADE'
        ? `<span class="px-1.5 py-0.5 rounded bg-slate-600 text-slate-100 text-[9px] font-black">＝同等</span>`
        : `<span class="px-1.5 py-0.5 rounded bg-sky-500 text-slate-950 text-[9px] font-black">+新規</span>`;

      const warnDetail = comp.hasWarning
        ? `<div class="text-[9px] text-rose-300 font-bold mt-0.5">⚠ ${comp.warnings[0]}</div>`
        : comp.currentSpec
        ? `<div class="text-[9px] text-slate-400 mt-0.5">現PC[${catLabel}]: ${comp.currentSpec.name} (ベンチ${comp.currentSpec.bench.toLocaleString()})</div>`
        : '';

      return `
        <div class="p-1.5 rounded-lg bg-slate-950/90 border ${comp.hasWarning ? 'border-rose-500/70' : 'border-slate-800'} text-[10px]">
          <div class="flex items-center justify-between gap-1.5">
            <div class="min-w-0">
              <span class="text-[9px] font-black px-1 py-0.5 rounded bg-slate-800 text-sky-300 mr-1">${catLabel}</span>
              <span class="font-bold text-white">${sp.name}</span>
              <span class="text-slate-400 ml-1">[${condShort} / ベンチ+${sp.bench.toLocaleString()}]</span>
            </div>
            <div class="shrink-0">${badge}</div>
          </div>
          ${warnDetail}
        </div>
      `;
    }).join('');

    return `
      <div class="mt-1.5 p-2 rounded-xl bg-slate-900/95 border border-indigo-500/40 text-[10px]">
        <div class="flex flex-wrap items-center justify-between gap-1 mb-1.5 font-black text-indigo-200">
          <span>📋 セット内容 (${partsList.length}点)</span>
          <span>合計ベンチ: <strong class="text-sky-300">${totalBench.toLocaleString()}</strong> / 推定消費: <strong class="text-amber-300">${totalWatt}W</strong></span>
        </div>
        ${internalWarnings.map(w => `<div class="mb-1.5 px-2 py-1 rounded bg-rose-950 border border-rose-500 text-rose-200 font-black">⚠ ${w}</div>`).join('')}
        <div class="flex flex-col gap-1 max-h-48 overflow-y-auto pr-0.5">
          ${rows}
        </div>
      </div>
    `;
  }

  /* ---------------------- MARKET GENERATION ---------------------- */
  function generateWeeklyMarket() {
    const availSpecs = CATALOG.filter(s => s.year <= state.year);
    const nonOsSpecs = availSpecs.filter(s => s.cat !== 'os');

    SHOPS.forEach(shop => {
      const items = [];
      const hasSale = (shop.type === 'used' || shop.type === 'new') && Math.random() < 0.45;
      const seenSignatures = new Set();

      const pushUniqueItem = (entry) => {
        const sig = `${entry.kind}:${entry.parts.map(p => `${p.specId}@${p.condition}`).join(',')}`;
        if (seenSignatures.has(sig) && items.length < 18) return false;
        seenSignatures.add(sig);
        items.push(entry);
        return true;
      };

      if (shop.type === 'new') {
        const orderedSpecs = availSpecs.slice().sort((a, b) => {
          if (shop.persona === 'ai_lab') {
            const wA = (a.cat === 'gpu' || a.cat === 'ram' || a.cat === 'cpu') ? a.bench * 1.4 : a.bench;
            const wB = (b.cat === 'gpu' || b.cat === 'ram' || b.cat === 'cpu') ? b.bench * 1.4 : b.bench;
            return wB - wA;
          }
          if (shop.persona === 'tough_quiet') {
            const wA = (a.cat === 'cooler' || a.cat === 'case' || a.cat === 'psu') ? a.dur * 25 : a.dur * 5;
            const wB = (b.cat === 'cooler' || b.cat === 'case' || b.cat === 'psu') ? b.dur * 25 : b.dur * 5;
            return wB - wA;
          }
          return a.price - b.price;
        });

        orderedSpecs.forEach((spec, idx) => {
          const personaMult = shop.persona === 'cospa_bto' ? 0.95 : shop.persona === 'ai_lab' ? 1.05 : 1.02;
          const fluct = (0.94 + Math.random() * 0.12) * personaMult;
          const isSaleItem = hasSale && idx % 4 === 0;
          const saleMult = isSaleItem ? 0.80 : 1.0;
          const price = Math.round((spec.price * fluct * saleMult) / 100) * 100;
          pushUniqueItem({
            id: `${shop.id}_${spec.id}_${idx}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'part',
            title: spec.name,
            parts: [{ specId: spec.id, condition: 'new', durRatio: 1 }],
            price,
            isSale: isSaleItem,
            seller: shop.name
          });
        });

        const btoProfiles = shop.persona === 'cospa_bto'
          ? [
              { key: 'cheap_starter', label: '【新品BTO】コスパ入門モデル', priceMult: 0.98 },
              { key: 'cospa_mid',     label: '【新品BTO】バランス万能機',   priceMult: 1.00 }
            ]
          : shop.persona === 'ai_lab'
          ? [
              { key: 'cospa_mid',     label: '【新品BTO】AIエントリー演算機', priceMult: 1.05 },
              { key: 'ai_compute',    label: '【新品BTO】AIラボ極限演算機',   priceMult: 1.10 }
            ]
          : [
              { key: 'office_compact', label: '【新品BTO】静音省電力モデル',    priceMult: 1.02 },
              { key: 'tough_quiet',    label: '【新品BTO】タフネス重装甲モデル', priceMult: 1.08 }
            ];

        btoProfiles.slice().reverse().forEach((prof, idx) => {
          const build = buildDistinctPreset(shop.persona, prof.key, 'new');
          const sumPrice = build.reduce((acc, b) => acc + getSpec(b.specId).price, 0);
          const isSaleItem = hasSale && idx === 0;
          const price = Math.round((sumPrice * prof.priceMult * (isSaleItem ? 0.85 : 1.03)) / 100) * 100;
          const bScore = estimateBuildBench(build);
          items.unshift({
            id: `${shop.id}_bto_${idx}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'pc',
            title: `${prof.label} [ベンチ${bScore.toLocaleString()}]`,
            parts: build,
            price,
            isSale: isSaleItem,
            seller: shop.name
          });
        });
      } else if (shop.type === 'used') {
        const usedPresets = [
          { key: 'cheap_starter',  label: '【格安中古PC】事務＆Eランク練習機', priceRange: [14500, 19500] },
          { key: 'odd_unbalanced', label: '【中古ワケありPC】偏りスペック機', priceRange: [21500, 28500] },
          { key: 'office_compact', label: '【中古整備PC】静音オフィス＆入門', priceRange: [29000, 39500] },
          { key: 'tough_quiet',    label: '【中古高耐久PC】頑丈冷却ワーク機', priceRange: [44000, 68000] }
        ];

        usedPresets.slice().reverse().forEach((preset, idx) => {
          const build = buildDistinctPreset(shop.persona, preset.key, 'used');
          const isSaleItem = hasSale && idx >= 2;
          const [pMin, pMax] = preset.priceRange;
          const rawP = pMin + Math.random() * (pMax - pMin);
          const price = Math.round((rawP * (isSaleItem ? 0.82 : 1)) / 100) * 100;
          const bScore = estimateBuildBench(build);
          items.unshift({
            id: `${shop.id}_upc_${idx}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'pc',
            title: `${preset.label} [ベンチ${bScore.toLocaleString()}]`,
            parts: build,
            price,
            isSale: isSaleItem,
            seller: shop.name
          });
        });

        for (let i = 0; i < 16; i++) {
          const spec = nonOsSpecs[(i + state.totalWeeks) % nonOsSpecs.length];
          const durRatio = 0.52 + Math.random() * 0.38;
          const isSaleItem = hasSale && i % 4 === 1;
          const price = Math.round((spec.price * (0.45 + durRatio * 0.34) * (isSaleItem ? 0.78 : 1)) / 100) * 100;
          pushUniqueItem({
            id: `${shop.id}_u_${i}_${Math.random().toString(36).slice(2, 6)}`,
            kind: 'part',
            title: `【中古】${spec.name}`,
            parts: [{ specId: spec.id, condition: 'used', durRatio }],
            price: Math.max(1000, price),
            isSale: isSaleItem,
            seller: shop.name
          });
        }
      } else if (shop.type === 'flea') {
        const roster = SELLERS_BY_PERSONA[shop.persona] || SELLERS_BY_PERSONA.odd_starter;

        if (shop.persona === 'odd_starter') {
          for (let c = 0; c < 3; c++) {
            const seller = roster[c % roster.length];
            const profKey = c === 2 ? 'odd_unbalanced' : 'cheap_starter';
            const build = buildDistinctPreset(shop.persona, profKey, 'used');
            const bScore = estimateBuildBench(build);
            const price = Math.round((15000 + c * 5500 + Math.random() * 4000) / 500) * 500;
            items.unshift({
              id: `${shop.id}_f1pc_${c}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'pc',
              title: `${c === 2 ? '【個人改造PC】変則構成機' : '【格安中古PC】入門お助け機'} [ベンチ${bScore.toLocaleString()}]`,
              parts: build,
              price,
              seller
            });
          }
          for (let i = 0; i < 12; i++) {
            const seller = roster[i % roster.length];
            const spec = nonOsSpecs[Math.floor(Math.random() * nonOsSpecs.length)];
            const isJunk = i % 3 === 0 || Math.random() < 0.25;
            const durRatio = isJunk ? 0 : (0.42 + Math.random() * 0.45);
            const rawPrice = isJunk ? spec.price * 0.14 : spec.price * (0.35 + durRatio * 0.34);
            pushUniqueItem({
              id: `${shop.id}_f1p_${i}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'part',
              title: `${isJunk ? '【ジャンク/現状品】' : '【個人出品】'}${spec.name}`,
              parts: [{ specId: spec.id, condition: isJunk ? 'junk' : 'used', durRatio }],
              price: Math.max(500, Math.round(rawPrice / 100) * 100),
              seller
            });
          }
        } else if (shop.persona === 'bundle_lot') {
          for (let b = 0; b < 5; b++) {
            const seller = roster[b % roster.length];
            const sampleBuild = buildDistinctPreset(shop.persona, b % 2 === 0 ? 'cheap_starter' : 'cospa_mid', 'used');
            const bundleCats = b % 2 === 0 ? ['cpu', 'mobo', 'ram'] : ['gpu', 'ram', 'ssd'];
            const bundleParts = sampleBuild.filter(x => bundleCats.includes(getSpec(x.specId).cat));
            const base = bundleParts.reduce((a, p) => a + getSpec(p.specId).price * 0.44, 0);
            const bScore = estimateBuildBench(bundleParts);
            items.unshift({
              id: `${shop.id}_f2b_${b}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'bundle',
              title: `【まとめ売${b + 1}】${bundleCats.map(k => PART_CATEGORIES.find(c => c.key === k).label).join('+')} [計${bScore.toLocaleString()}]`,
              parts: bundleParts,
              price: Math.max(3000, Math.round(base / 100) * 100),
              seller
            });
          }
          for (let k = 0; k < 2; k++) {
            const seller = roster[k % roster.length];
            let inc = buildDistinctPreset(shop.persona, 'cospa_mid', 'used');
            const drop = k === 0 ? ['gpu', 'os'] : ['ssd'];
            inc = inc.filter(x => !drop.includes(getSpec(x.specId).cat));
            const bScore = estimateBuildBench(inc);
            const base = inc.reduce((a, p) => a + getSpec(p.specId).price * 0.46, 0);
            items.push({
              id: `${shop.id}_f2inc_${k}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'incomplete_pc',
              title: `【組替途中PC】${k === 0 ? 'グラボ・OS欠品' : 'SSD欠品'} [ベンチ${bScore.toLocaleString()}]`,
              parts: inc,
              price: Math.max(6000, Math.round(base / 100) * 100),
              seller
            });
          }
          for (let i = 0; i < 8; i++) {
            const seller = roster[i % roster.length];
            const spec = nonOsSpecs[Math.floor(Math.random() * nonOsSpecs.length)];
            const durRatio = 0.5 + Math.random() * 0.38;
            pushUniqueItem({
              id: `${shop.id}_f2p_${i}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'part',
              title: `【漁り品】${spec.name}`,
              parts: [{ specId: spec.id, condition: 'used', durRatio }],
              price: Math.max(800, Math.round((spec.price * 0.5) / 100) * 100),
              seller
            });
          }
        } else {
          for (let e = 0; e < 3; e++) {
            const seller = roster[e % roster.length];
            const profKey = e === 0 ? 'ai_compute' : e === 1 ? 'tough_quiet' : 'enthusiast_rig';
            const build = buildDistinctPreset(shop.persona, profKey, 'used');
            const bScore = estimateBuildBench(build);
            const rawSum = build.reduce((a, p) => a + getSpec(p.specId).price * 0.65, 0);
            items.unshift({
              id: `${shop.id}_f3pc_${e}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'pc',
              title: `【ガチ勢放出】${e === 0 ? '爆演算特化機' : e === 1 ? '重装甲耐久機' : 'チューンド機'} [ベンチ${bScore.toLocaleString()}]`,
              parts: build,
              price: Math.max(25000, Math.round(rawSum / 500) * 500),
              seller
            });
          }
          const highSpecs = nonOsSpecs.slice().sort((a, b) => b.bench - a.bench).slice(0, Math.max(8, Math.ceil(nonOsSpecs.length * 0.65)));
          for (let i = 0; i < 10; i++) {
            const seller = roster[i % roster.length];
            const spec = highSpecs[i % highSpecs.length];
            const durRatio = 0.58 + Math.random() * 0.36;
            const price = Math.round((spec.price * (0.52 + durRatio * 0.32)) / 100) * 100;
            pushUniqueItem({
              id: `${shop.id}_f3p_${i}_${Math.random().toString(36).slice(2, 6)}`,
              kind: 'part',
              title: `【掘り出し物】${spec.name}`,
              parts: [{ specId: spec.id, condition: 'used', durRatio }],
              price: Math.max(1500, price),
              seller
            });
          }
        }
      }

      state.market[shop.id] = { hasSale, items };
    });
  }

  /* ---------------------- TIME PROGRESSION & EVENTS ---------------------- */
  function advanceWeek() {
    state.totalWeeks++;
    state.week++;
    if (state.week > 4) {
      state.week = 1;
      state.month++;
      if (state.month > 12) {
        state.month = 1;
        state.year++;
      }
    }

    if (state.year >= 2037 && state.month === 1 && state.week === 1) {
      writeSave();
      triggerTimeUpBadEnd();
      return;
    }

    const arrivedMessages = [];
    if (Array.isArray(state.deliveries) && state.deliveries.length > 0) {
      state.deliveries.forEach(del => {
        const createdParts = del.parts.map(p => makePartInstance(p.specId, p.condition, p.durRatio));
        if ((del.kind === 'pc' || del.kind === 'incomplete_pc' || del.kind === 'bto_pc') && state.pcs.length < 6) {
          const newPc = {
            id: Date.now() + Math.random(),
            name: del.pcName || `届いたPC${state.pcs.length + 1}号`,
            parts: {}
          };
          createdParts.forEach(pt => {
            const cat = getSpec(pt.specId).cat;
            if (!newPc.parts[cat]) {
              newPc.parts[cat] = pt;
            } else {
              state.inventory.push(pt);
            }
          });
          evaluatePC(newPc);
          state.pcs.push(newPc);
          arrivedMessages.push(`📦 配送到着！「${del.title}」が届き、${newPc.name}として部屋に配置された！`);
        } else {
          createdParts.forEach(pt => state.inventory.push(pt));
          arrivedMessages.push(`📦 配送到着！「${del.title}」(${createdParts.length}点)が手持ちパーツに追加された！`);
        }
      });
      state.deliveries = [];
    }

    let monthlySalaryMsg = '';
    if (state.week === 1) {
      const salary = 40000;
      state.money += salary;
      monthlySalaryMsg = `💴 毎月1週目の固定収入 +¥${salary.toLocaleString()} を受け取った！`;
      addLog(monthlySalaryMsg);
    }

    arrivedMessages.forEach(m => addLog(m));

    const soldLogs = [];
    state.listings = state.listings.filter(lst => {
      lst.weeksListed++;
      const fairValue = lst.items.reduce((acc, it) => {
        const sp = getSpec(it.specId);
        const ratio = sp.cat === 'os' ? 0.5 : (it.dur <= 0 ? 0.14 : (0.35 + (it.dur / it.maxDur) * 0.45));
        return acc + sp.price * ratio;
      }, 0);
      const ratioToFair = lst.price / Math.max(500, fairValue);
      let sellChance = 0.01;
      if (ratioToFair <= 0.85) sellChance = 0.85;
      else if (ratioToFair <= 1.05) sellChance = 0.55;
      else if (ratioToFair <= 1.25) sellChance = 0.25;
      else if (ratioToFair <= 1.45) sellChance = 0.08;

      if (Math.random() < sellChance) {
        const fee = Math.round(lst.price * 0.10);
        const profit = lst.price - fee;
        state.money += profit;
        soldLogs.push(`フリマ出品「${lst.title}」が¥${lst.price.toLocaleString()}で売却！(手数料10%差引 +¥${profit.toLocaleString()})`);
        return false;
      }
      return true;
    });

    soldLogs.forEach(m => addLog(m));
    generateWeeklyMarket();
    writeSave();

    if (state.month === 10 && state.week === 2) {
      state.age++;
      const bonus = 15000;
      state.money += bonus;
      addLog(`🎂 10月2週目！次郎は${state.age}歳の誕生日を迎えた！お祝い臨時収入+¥${bonus.toLocaleString()}`);
      writeSave();
      startAdv([
        { speaker: 'ナレーション', mood: 'happy', text: `${state.year}年10月2週目――今日は主人公・次郎の誕生日だ！` },
        { speaker: `次郎（${state.age}歳）`, mood: 'happy', text: `「おおっ、俺も今日で${state.age}歳か！お腹の貫禄は増したが、髪の毛はまだまだフサフサだぜ！」` },
        { speaker: `次郎（${state.age}歳）`, mood: 'normal', text: '「お祝いポケットマネー¥15,000も発掘したし、2037年までに必ずSランク制覇してやる！」' }
      ], () => renderApp());
      return;
    }

    if (state.month === 1 && state.week === 1 && !state.flags.announcedYears[state.year]) {
      state.flags.announcedYears[state.year] = true;
      const newReleases = CATALOG.filter(s => s.year === state.year);
      if (newReleases.length > 0) {
        writeSave();
        startAdv([
          { speaker: '電脳ニュース速報', mood: 'normal', text: `${state.year}年新春！次世代パーツ「${newReleases[0].name}」などが登場し、大会の必要ベンチマーク基準も時代に合わせて更新された！` },
          { speaker: `次郎（${state.age}歳）`, mood: 'happy', text: '「おおっ、新しい時代とパーツが来たぞ！ソケットと耐久を見極めて勝ち上がろう！」' }
        ], () => renderApp());
        return;
      }
    }

    if (monthlySalaryMsg || arrivedMessages.length > 0) {
      const lines = [];
      if (monthlySalaryMsg) {
        lines.push({ speaker: '次郎', mood: 'happy', text: '「おっ！今月1週目の固定収入¥40,000が入ったぞ！少しずつでも資金を貯めていけるな！」' });
      }
      if (arrivedMessages.length > 0) {
        lines.push({ speaker: '宅配便の配達員', mood: 'normal', text: `「お待たせしました！次郎さん宛ての荷物が届きましたよ！（${arrivedMessages.length}件）」` });
        lines.push({ speaker: '次郎', mood: 'build', text: '「おおっ、注文していた品物が届いたか！さっそく確認しよう！」' });
      }
      AudioSys.se('buy');
      startAdv(lines, () => renderApp());
      return;
    }

    const totalAssetsCount =
      state.inventory.length +
      state.deliveries.length +
      state.listings.length +
      state.pcs.reduce((acc, pc) => acc + Object.keys(pc.parts || {}).length, 0);

    if (state.money < 500 && totalAssetsCount === 0) {
      triggerBankruptBadEnd();
      return;
    }

    if (soldLogs.length > 0) {
      AudioSys.se('buy');
      FX.confetti();
    }
    renderApp();
  }

  /* ---------------------- MAIN SHELL RENDERER ---------------------- */
  function renderApp() {
    if (advMode || inArena || !state) return;
    document.getElementById('hud-header').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');

    document.getElementById('hud-date').textContent = `${state.year}年${state.month}月${state.week}週`;
    document.getElementById('hud-age').textContent = `次郎(${state.age}歳)`;
    document.getElementById('hud-money').textContent = `¥${state.money.toLocaleString()}`;

    ['home', 'build', 'shop', 'flea', 'battle'].forEach(t => {
      const btn = document.getElementById(`nav-${t}`);
      if (!btn) return;
      if (t === currentTab) {
        btn.className = 'nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-[10px] font-black bg-sky-500 text-slate-950 shadow';
      } else {
        btn.className = 'nav-btn py-1.5 rounded-xl flex flex-col items-center justify-center text-[10px] font-black bg-slate-800/90 text-slate-300 hover:bg-slate-700';
      }
    });

    if (currentTab === 'home') renderHomeTab();
    else if (currentTab === 'build') renderBuildTab();
    else if (currentTab === 'shop') renderShopTab();
    else if (currentTab === 'flea') renderFleaTab();
    else if (currentTab === 'battle') renderBattleTab();
  }

  function setTab(tab) {
    if (inArena || advMode) return;
    AudioSys.se('click');
    currentTab = tab;
    if (tab === 'shop') AudioSys.playBgm('shop');
    else AudioSys.playBgm('room');
    renderApp();
  }

    if (state.pcs.length >= 6) {
      showModal('上限です', '部屋に置けるパソコンは最大6台までです。不要なPCを分解または処分してください。', [{ label: 'OK' }]);

  /* ---------------------- TAB 2: PC BUILDER & ASSEMBLY ---------------------- */
  function renderBuildTab() {
    if (!state.pcs[selectedPcIdx]) selectedPcIdx = 0;
    comparePcIdx = selectedPcIdx;
    const pc = state.pcs[selectedPcIdx];
    const st = evaluatePC(pc);

    const pcTabs = state.pcs.map((p, idx) => `
      <button type="button" onclick="App.selectPcSlot(${idx})" class="px-2.5 py-1 rounded-lg text-[11px] font-black shrink-0 ${idx === selectedPcIdx ? 'bg-sky-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}">
        ${p.name}
      </button>
    `).join('');

    const slotRows = PART_CATEGORIES.map(cat => {
      const equipped = pc.parts[cat.key];
      const spec = equipped ? getSpec(equipped.specId) : null;
      const compatCount = state.inventory.filter(it => getSpec(it.specId).cat === cat.key).length;

      let durBadge = '';
      let specMeta = '';
      if (equipped && spec) {
        specMeta = spec.socket
          ? `ソケット:${spec.socket}`
          : spec.ramType
          ? `メモリ:${spec.ramType}`
          : spec.supply
          ? `電源:${spec.supply}W`
          : `消費:${spec.watt || 0}W / ベンチ+${spec.bench.toLocaleString()}`;

        if (spec.cat === 'os') {
          durBadge = '<span class="text-[10px] text-sky-300 font-bold">ライセンス済</span>';
        } else if (equipped.dur <= 0) {
          durBadge = `<span class="text-[10px] text-rose-400 font-black">💥 破損 (0/${equipped.maxDur})</span>`;
        } else {
          const pct = Math.round((equipped.dur / equipped.maxDur) * 100);
          durBadge = `<span class="text-[10px] ${pct < 35 ? 'text-amber-300' : 'text-emerald-300'} font-bold">耐久 ${equipped.dur}/${equipped.maxDur}</span>`;
        }
      }

      return `
        <div class="p-2 rounded-xl bg-slate-800/90 border ${equipped ? (equipped.dur <= 0 && spec.cat !== 'os' ? 'border-rose-500/80' : 'border-slate-700') : 'border-dashed border-slate-600'} flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            ${equipped ? svgPartIcon(cat.key, spec.tier, equipped.dur <= 0 && spec.cat !== 'os', 34) : '<div class="w-[34px] h-[34px] rounded-lg bg-slate-900 border border-slate-700 flex items-center justify-center text-[10px] text-slate-500">空</div>'}
            <div class="min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-slate-900 text-slate-300">${cat.label}</span>
                ${durBadge}
                ${specMeta ? `<span class="text-[9px] text-slate-400">${specMeta}</span>` : ''}
              </div>
              <div class="text-xs font-bold text-white truncate mt-0.5">
                ${spec ? spec.name : '<span class="text-slate-500">未装着</span>'}
              </div>
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" onclick="App.openPartPicker('${cat.key}')" class="px-2 py-1 rounded-lg text-[10px] font-black ${compatCount > 0 ? 'bg-sky-600 hover:bg-sky-500 text-white' : 'bg-slate-700 text-slate-400'}">
              変更(${compatCount})
            </button>
            ${equipped ? `<button type="button" onclick="App.unequipPart('${cat.key}')" class="px-1.5 py-1 rounded-lg bg-slate-700 hover:bg-slate-600 text-[10px] font-bold text-slate-200">外す</button>` : ''}
          </div>
        </div>
      `;
    }).join('');

    const issueListHtml = st.issues.length > 0
      ? `<div class="mt-1.5 p-2 rounded-xl bg-rose-950/70 border border-rose-500/60 text-[10px] text-rose-200 font-bold">
           <div class="font-black text-rose-300 mb-0.5">💡 現在の構成チェック（初心者ガイド）:</div>
           ${st.issues.map(iss => `<div>・${iss}</div>`).join('')}
         </div>`
      : `<div class="mt-1.5 px-2 py-1 rounded-lg bg-emerald-950/60 border border-emerald-500/50 text-[10px] text-emerald-300 font-bold">

  function openPartPicker(catKey) {
    AudioSys.se('click');
    const candidates = state.inventory.filter(it => getSpec(it.specId).cat === catKey);

      return `

  }

  function equipPart(uid) {
    const idx = state.inventory.findIndex(x => x.uid === uid);
    if (idx === -1) return;
    const item = state.inventory[idx];
    const sp = getSpec(item.specId);
    const pc = state.pcs[selectedPcIdx];

    if (pc.parts[sp.cat]) {
      state.inventory.push(pc.parts[sp.cat]);
    }
    pc.parts[sp.cat] = item;
    state.inventory.splice(idx, 1);

    closeModal();
    AudioSys.se('build');
    const st = evaluatePC(pc);
    writeSave();

    if (st.ok && !state.flags.seenFirstPc) {
      state.flags.seenFirstPc = true;
      writeSave();
      startAdv([
        { speaker: `次郎（${state.age}歳）`, mood: 'happy', text: '「おおおっ！電源スイッチON……ファンが光ってOSが起動したぞ！！」' },
        { speaker: `次郎（${state.age}歳）`, mood: 'happy', text: `「ベンチマークは${st.bench.toLocaleString()}！よし、いよいよ『大会』タブからパソコンバトルに参戦だ！」` }
      ], () => renderApp());
      return;
    }

    renderApp();
  }

  function unequipPart(catKey) {
    const pc = state.pcs[selectedPcIdx];
    if (!pc.parts[catKey]) return;
    AudioSys.se('click');
    state.inventory.push(pc.parts[catKey]);
    delete pc.parts[catKey];
    evaluatePC(pc);
    writeSave();
    renderApp();
  }

  function disassemblePc() {
    const pc = state.pcs[selectedPcIdx];
    const keys = Object.keys(pc.parts);
    if (keys.length === 0) return;
    AudioSys.se('build');
    keys.forEach(k => {
      state.inventory.push(pc.parts[k]);
      delete pc.parts[k];
    });
    evaluatePC(pc);
    addLog(`${pc.name}をすべてパーツに分解した。`);
    writeSave();
    renderApp();
  }

  function trashPcOrParts() {
    AudioSys.se('click');
    const pc = state.pcs[selectedPcIdx];
    const invHtml = state.inventory.map(it => {
      const sp = getSpec(it.specId);
      return `
        <div class="flex items-center justify-between py-1 border-b border-slate-800 text-[11px]">
          <span class="truncate pr-2">${sp.name} (${sp.cat === 'os' ? 'OS' : `耐久${it.dur}`})</span>
          <button type="button" onclick="App.trashInventoryItem(${it.uid})" class="px-2 py-0.5 rounded bg-rose-600 text-white font-bold shrink-0">捨てる</button>
        </div>
      `;
    }).join('');

    showModal(
      '不要なPC・パーツの処分（無料）',
      `
        <p class="mb-2 text-[11px] text-slate-300">破損したパーツや不要なPCを0円で処分できます。</p>
        <button type="button" onclick="App.trashCurrentPc()" class="w-full mb-3 py-1.5 rounded-lg bg-rose-700 text-white font-black text-xs">
          現在選択中の「${pc.name}」を丸ごと処分する
        </button>
        <div class="font-bold text-slate-300 mb-1">手持ちパーツ一覧 (${state.inventory.length}個):</div>
        ${invHtml || '<div class="text-slate-500">手持ちパーツはありません</div>'}
      `,
      [{ label: '閉じる' }]
    );
  }

  function trashCurrentPc() {
    const pc = state.pcs[selectedPcIdx];
    addLog(`${pc.name}を無料で処分した。`);
    if (state.pcs.length > 1) {
      state.pcs.splice(selectedPcIdx, 1);
      selectedPcIdx = 0;
    } else {
      pc.parts = {};
      evaluatePC(pc);
    }
    closeModal();
    writeSave();
    renderApp();
  }

  function trashInventoryItem(uid) {
    const idx = state.inventory.findIndex(x => x.uid === uid);
    if (idx !== -1) {
      const sp = getSpec(state.inventory[idx].specId);
      state.inventory.splice(idx, 1);
      addLog(`不要パーツ「${sp.name}」を無料で処分した。`);
      writeSave();
      trashPcOrParts();
      renderApp();
    }
  }

  /* ---------------------- TAB 3: 7 ONLINE SHOPS & BTO ---------------------- */

    const shop = SHOPS.find(s => s.id === selectedShopId) || SHOPS[0];

    const shopBtns = SHOPS.map(s => {

      return `
        <button type="button" onclick="App.selectShop('${s.id}')" class="px-2 py-1 rounded-lg text-[10px] font-black shrink-0 ${active ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}">
          ${s.tag}${saleDot}

          if (siteLoyalty >= 2) discountRate += 0.05;

        const detailHtml = !isBundleOrPc
          ? renderPartComparisonBlock(firstSpec, item.parts[0].condition, item.parts[0].durRatio, refPc)
          : renderBundleBreakdownHtml(item.parts, refPc);

        return `
          <div class="p-2.5 rounded-xl bg-slate-800/95 border ${hasAnyWarn ? 'border-rose-500/70' : item.isSale ? 'border-amber-400/80' : 'border-slate-700'} flex flex-col gap-1">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                ${svgPartIcon(firstSpec.cat, firstSpec.tier, item.parts[0].condition === 'junk', 36)}
                <div class="min-w-0">
                  <div class="flex items-center gap-1 flex-wrap">
                    ${item.isSale ? '<span class="px-1 rounded bg-rose-600 text-white text-[9px] font-black">SALE</span>' : ''}

                    ${hasAnyWarn ? '<span class="px-1 rounded bg-rose-500 text-white text-[9px] font-black">⚠要注意あり</span>' : ''}
                    <span class="text-xs font-black text-white">${item.title}</span>
                  </div>
                  ${shop.type === 'flea' ? `<div class="text-[9px] text-slate-400">出品者: ${item.seller}</div>` : ''}
                </div>
              </div>
              <button type="button" onclick="App.buyMarketItem('${shop.id}', '${item.id}')" ${canAfford ? '' : 'disabled'} class="px-2.5 py-1.5 rounded-xl text-[11px] font-black shrink-0 ${canAfford ? 'bg-amber-400 hover:bg-amber-300 text-slate-950' : 'bg-slate-700 text-slate-500'}">
                ¥${finalPrice.toLocaleString()}
              </button>
            </div>
            ${detailHtml}
          </div>
        `;
      }).join('');

      bodyHtml = `<div class="flex flex-col gap-2">${itemsHtml}</div>`;
    }

    main.innerHTML = `
      <div class="flex-1 flex flex-col justify-between p-3 gap-2 overflow-y-auto text-slate-100">

          ${shopBtns}

            <span class="font-black text-sm">${shop.name}</span>
            ${mkt.hasSale ? '<span class="px-2 py-0.5 rounded-full bg-yellow-300 text-slate-950 text-[10px] font-black animate-pulse">🔥 特価セール開催中！</span>' : ''}
          </div>
          <p class="text-[10px] text-white/90 mt-0.5">${shop.desc}（購入品は翌週到着）</p>
          ${shop.type === 'new' ? `
            <div class="mt-2 grid grid-cols-2 gap-1.5">
              <button type="button" onclick="App.setShopSubMode('browse')" class="py-1 rounded-lg text-[11px] font-black ${shopSubMode === 'browse' ? 'bg-slate-950 text-white' : 'bg-white/20 text-white'}">
                パーツ・OS・完成品一覧
              </button>
              <button type="button" onclick="App.setShopSubMode('bto')" class="py-1 rounded-lg text-[11px] font-black ${shopSubMode === 'bto' ? 'bg-amber-300 text-slate-950' : 'bg-white/20 text-white'}">

  function selectShop(id) {
    AudioSys.se('click');
    selectedShopId = id;
    shopSubMode = 'browse';
    renderApp();
  }

  function setShopSubMode(mode) {
    AudioSys.se('click');
    shopSubMode = mode;
    if (mode === 'bto') {
      const def = createAutoCompleteBuild(Math.min(3, 1 + Math.floor((state.year - 2027) / 3)), 'new');
      btoDraft = {};
      def.forEach(d => { btoDraft[getSpec(d.specId).cat] = d.specId; });
    }
    renderApp();
  }

  function renderBtoConfigurator() {
    const avail = CATALOG.filter(s => s.year <= state.year);
    const refPc = getComparePC();
    let totalCost = 0;
    let totalBench = 0;
    let totalWatt = 0;
    let supplyWatt = 0;

    const selectors = PART_CATEGORIES.map(cat => {
      const options = avail.filter(s => s.cat === cat.key);
      const chosenId = btoDraft[cat.key] || options[0].id;
      btoDraft[cat.key] = chosenId;
      const sp = getSpec(chosenId);
      totalCost += sp.price;
      totalBench += sp.bench;
      totalWatt += (sp.watt || 0);
      if (cat.key === 'psu') supplyWatt = sp.supply || 0;

      const comp = analyzeCandidatePart(sp, 'new', refPc);
      const diffBadge = comp.deltaVerdict === 'UPGRADE'
        ? '<span class="text-emerald-300 font-black">▲強化</span>'
        : comp.deltaVerdict === 'DOWNGRADE'
        ? '<span class="text-amber-300 font-black">▼低下</span>'
        : comp.deltaVerdict === 'SIDEGRADE'
        ? '<span class="text-slate-300 font-black">＝同等</span>'
        : '<span class="text-sky-300 font-black">+新規</span>';

      const optHtml = options.map(o => `<option value="${o.id}" ${o.id === chosenId ? 'selected' : ''}>${o.name} (¥${o.price.toLocaleString()})</option>`).join('');
      return `
        <div class="bg-slate-800/90 p-1.5 rounded-lg border ${comp.hasWarning ? 'border-rose-500/80' : 'border-slate-700'} text-[11px]">
          <div class="flex items-center justify-between gap-2">
            <span class="font-bold text-slate-300 w-20 shrink-0">${cat.label}</span>
            <select onchange="App.updateBtoPart('${cat.key}', this.value)" class="flex-1 bg-slate-950 text-white border border-slate-600 rounded px-1.5 py-1 text-[11px] font-bold">
              ${optHtml}
            </select>
          </div>
          <div class="mt-1 flex items-center justify-between text-[10px] px-0.5">
            <span>${diffBadge} (ベンチ+${sp.bench.toLocaleString()})</span>
            ${comp.hasWarning ? `<span class="text-rose-300 font-black truncate max-w-[190px]">⚠ ${comp.warnings[0]}</span>` : ''}
          </div>
        </div>
      `;
    }).join('');

    const cpuSp = getSpec(btoDraft.cpu);
    const mbSp = getSpec(btoDraft.mobo);
    const ramSp = getSpec(btoDraft.ram);
    const btoIssues = [];
    if (cpuSp.socket !== mbSp.socket) btoIssues.push(`ソケット不一致(${cpuSp.socket}≠${mbSp.socket})`);
    if (mbSp.ramType !== ramSp.ramType) btoIssues.push(`メモリ不一致(${mbSp.ramType}≠${ramSp.ramType})`);
    if (totalWatt > supplyWatt) btoIssues.push(`電源容量不足(${totalWatt}W>${supplyWatt}W)`);

    const assemblyFee = 5000;
    const grandTotal = totalCost + assemblyFee;
    const canOrder = btoIssues.length === 0 && state.money >= grandTotal;

    return `
      <div class="flex flex-col gap-1.5">
        <div class="p-2 rounded-xl bg-slate-900 border border-sky-500/50 text-[11px]">
          <div class="flex justify-between font-black">
            <span>予想ベンチ: <strong class="text-sky-300">${totalBench.toLocaleString()}</strong></span>
            <span>合計(組立費¥5,000込): <strong class="text-amber-300">¥${grandTotal.toLocaleString()}</strong></span>
          </div>
          ${btoIssues.length > 0 ? `<div class="text-rose-400 font-bold mt-1">⚠ ${btoIssues.join(' / ')}</div>` : '<div class="text-emerald-400 font-bold mt-1">✔ 相性チェックOK！翌週完成状態で届きます</div>'}
        </div>
        ${selectors}
        <button type="button" onclick="App.orderBtoPc(${grandTotal})" ${canOrder ? '' : 'disabled'} class="w-full py-2.5 rounded-xl font-black text-xs ${canOrder ? 'bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 shadow-lg' : 'bg-slate-700 text-slate-500'}">
          🛒 この構成でBTOパソコンを注文する (¥${grandTotal.toLocaleString()})
        </button>
      </div>
    `;
  }

  function updateBtoPart(catKey, specId) {
    btoDraft[catKey] = specId;
    renderApp();
  }

  function orderBtoPc(grandTotal) {
    if (state.money < grandTotal) return;
    if (state.pcs.length + state.deliveries.length >= 6) {
      showModal('PC枠がいっぱいです', '所持・配送中のPC枠が上限(6台)に達しています。先に既存のPCを分解または処分してください。', [{ label: 'OK' }]);
      return;
    }
    state.money -= grandTotal;
    const pcName = `BTO-${state.pcs.length + state.deliveries.length + 1}号機`;
    const partsSpec = PART_CATEGORIES.map(c => ({
      specId: btoDraft[c.key],
      condition: 'new',
      durRatio: 1
    }));
    state.deliveries.push({
      id: Date.now() + Math.random(),
      shopName: 'BTOカスタム通販',
      title: `【BTO注文】${pcName}`,
      kind: 'bto_pc',
      pcName,
      parts: partsSpec
    });
    AudioSys.se('buy');
    addLog(`BTOパソコン「${pcName}」を¥${grandTotal.toLocaleString()}で注文した（翌週到着予定）。`);
    writeSave();
    showModal('注文完了（翌週到着）', `BTOパソコン「${pcName}」を注文しました！<br><span class="text-amber-300 font-bold">🚚 商品は翌週の週替わり時に届きます。</span>`, [{ label: 'OK', onClick: () => renderApp() }]);
  }

  function buyMarketItem(shopId, itemId) {
    const shop = SHOPS.find(s => s.id === shopId);
    const mkt = state.market[shopId];
    if (!shop || !mkt) return;
    const idx = mkt.items.findIndex(x => x.id === itemId);
    if (idx === -1) return;
    const item = mkt.items[idx];

    let discountRate = 0;
    if (shop.type === 'flea') {
      const sellerCount = state.sellerLoyalty[item.seller] || 0;
      if (sellerCount > 0) discountRate += Math.min(0.10, sellerCount * 0.05);
      if ((state.fleaLoyalty[shop.id] || 0) >= 2) discountRate += 0.05;
    }
    const finalPrice = Math.round((item.price * (1 - discountRate)) / 100) * 100;
    if (state.money < finalPrice) return;

    state.money -= finalPrice;
    if (shop.type === 'flea') {
      state.fleaLoyalty[shop.id] = (state.fleaLoyalty[shop.id] || 0) + 1;
      state.sellerLoyalty[item.seller] = (state.sellerLoyalty[item.seller] || 0) + 1;
      mkt.items.splice(idx, 1);
    }

    const pcName = (item.kind === 'pc' || item.kind === 'incomplete_pc')
      ? `${item.kind === 'pc' ? '中古PC' : '欠品PC'}${state.pcs.length + state.deliveries.length + 1}号`
      : null;

    state.deliveries.push({
      id: Date.now() + Math.random(),
      shopName: shop.name,
      title: item.title,
      kind: item.kind,
      pcName,
      parts: item.parts.map(p => ({ specId: p.specId, condition: p.condition, durRatio: p.durRatio }))
    });

    AudioSys.se('buy');
    addLog(`${shop.name}で「${item.title}」を¥${finalPrice.toLocaleString()}で購入（翌週到着予定）。`);
    writeSave();
    showModal('購入完了（翌週到着）', `「${item.title}」を購入しました！<br><span class="text-amber-300 font-bold">🚚 配送中のため、翌週に進むと手元に届きます。</span>`, [{ label: 'OK', onClick: () => renderApp() }]);
  }

  /* ---------------------- TAB 4: FLEA MARKET LISTING ---------------------- */
  function renderFleaTab() {
    const refPc = getComparePC();
    const invCheckboxes = state.inventory.map(it => {
      const sp = getSpec(it.specId);
      const checked = fleaDraft.selectedUids.includes(it.uid);

      const badge = comp.deltaVerdict === 'UPGRADE' ? '▲強化' : comp.deltaVerdict === 'DOWNGRADE' ? '▼低下' : comp.deltaVerdict === 'SIDEGRADE' ? '＝同等' : '+新規';
