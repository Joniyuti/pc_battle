  function recalcSuggestedFleaPrice() {
    const sum = fleaDraft.selectedUids.reduce((acc, id) => {
      const it = state.inventory.find(x => x.uid === id);
      if (!it) return acc;
      const sp = getSpec(it.specId);
      const ratio = sp.cat === 'os' ? 0.5 : (it.dur <= 0 ? 0.15 : (0.35 + (it.dur / it.maxDur) * 0.45));
      return acc + sp.price * ratio;
    }, 0);
    if (sum > 0) fleaDraft.price = Math.max(500, Math.round(sum / 500) * 500);
  }

  function toggleFleaSelect(uid) {
    AudioSys.se('click');
    const i = fleaDraft.selectedUids.indexOf(uid);
    if (i === -1) fleaDraft.selectedUids.push(uid);
    else fleaDraft.selectedUids.splice(i, 1);
    recalcSuggestedFleaPrice();
    renderApp();
  }

  function selectAllFleaItems() {
    AudioSys.se('click');
    fleaDraft.selectedUids = state.inventory.map(it => it.uid);
    recalcSuggestedFleaPrice();
    renderApp();
  }

  function deselectAllFleaItems() {
    AudioSys.se('click');
    fleaDraft.selectedUids = [];
    renderApp();
  }

  function updateFleaPrice(val) {
    fleaDraft.price = Math.max(500, parseInt(val, 10) || 1000);
  }

  function packPcForListing(pcIdx) {
    const idx = parseInt(pcIdx, 10);
    const pc = state.pcs[idx];
    if (!pc || !pc.parts) return;
    const keys = Object.keys(pc.parts);
    if (keys.length === 0) return;

    const snapshotParts = {};
    const movedUids = [];
    keys.forEach(k => {
      const item = pc.parts[k];
      if (!item) return;
      snapshotParts[k] = Object.assign({}, item);
      if (!state.inventory.some(inv => inv.uid === item.uid)) {
        state.inventory.push(item);
      }
      movedUids.push(item.uid);
      delete pc.parts[k];
    });

    if (movedUids.length === 0) return;

    disassembleHistory.unshift({
      pcId: pc.id,
      pcName: pc.name,
      parts: snapshotParts,
      movedUids
    });
    if (disassembleHistory.length > 6) disassembleHistory.pop();

    movedUids.forEach(uid => {
      if (!fleaDraft.selectedUids.includes(uid)) {
        fleaDraft.selectedUids.push(uid);
      }
    });

    evaluatePC(pc);
    recalcSuggestedFleaPrice();
    AudioSys.se('build');
    writeSave();
    renderApp();
  }

  function restoreDisassembledPc(histIdx) {
    const snap = disassembleHistory[histIdx];
    if (!snap) return;

    let targetPc = state.pcs.find(p => p.id === snap.pcId) || state.pcs[0];
    if (!targetPc && state.pcs.length < 6) {
      targetPc = { id: snap.pcId || Date.now(), name: snap.pcName || '復元PC', parts: {} };
      state.pcs.push(targetPc);
    }
    if (!targetPc) return;

    const movedSet = new Set(snap.movedUids || []);
    fleaDraft.selectedUids = fleaDraft.selectedUids.filter(uid => !movedSet.has(uid));

    Object.entries(snap.parts || {}).forEach(([catKey, savedPart]) => {
      if (!savedPart) return;
      const invIdx = state.inventory.findIndex(it => it.uid === savedPart.uid);
      let restoredItem = savedPart;
      if (invIdx !== -1) {
        restoredItem = state.inventory.splice(invIdx, 1)[0];
      }
      if (targetPc.parts[catKey]) {
        state.inventory.push(targetPc.parts[catKey]);
      }
      targetPc.parts[catKey] = restoredItem;
    });

    disassembleHistory.splice(histIdx, 1);
    evaluatePC(targetPc);
    recalcSuggestedFleaPrice();
    AudioSys.se('build');
    writeSave();
    renderApp();
  }

  function createFleaListing() {
    if (fleaDraft.selectedUids.length === 0) return;
    const shopEl = document.getElementById('flea-target-shop');
    const priceInput = document.getElementById('flea-price-input');
    const shopId = shopEl ? shopEl.value : 'flea1';
    const price = Math.max(500, parseInt(priceInput ? priceInput.value : fleaDraft.price, 10) || fleaDraft.price);

    const packedItems = [];
    fleaDraft.selectedUids.forEach(uid => {
      const idx = state.inventory.findIndex(x => x.uid === uid);
      if (idx !== -1) {
        packedItems.push(state.inventory[idx]);
        state.inventory.splice(idx, 1);
      }
    });

    if (packedItems.length === 0) {
      fleaDraft.selectedUids = [];
      renderApp();
      return;
    }

    const firstSp = getSpec(packedItems[0].specId);
    const hasBroken = packedItems.some(x => x.dur <= 0 && getSpec(x.specId).cat !== 'os');
    const title = packedItems.length >= 8
      ? `自作PC本体${hasBroken ? '(ジャンク)' : ''}`
      : packedItems.length > 1
      ? `${firstSp.name} ほか${packedItems.length}点セット`
      : `${hasBroken ? '[破損]' : ''}${firstSp.name}`;

    state.listings.push({
      id: Date.now() + Math.random(),
      shopId,
      title,
      items: packedItems,
      price,
      weeksListed: 0
    });

    fleaDraft.selectedUids = [];
    AudioSys.se('buy');
    addLog(`フリマに「${title}」を¥${price.toLocaleString()}で出品した。`);
    writeSave();
    renderApp();
  }

  function cancelListing(listingId) {
    const idx = state.listings.findIndex(x => x.id === listingId);
    if (idx === -1) return;
    const lst = state.listings[idx];
    lst.items.forEach(it => state.inventory.push(it));
    state.listings.splice(idx, 1);
    AudioSys.se('click');
    addLog(`出品「${lst.title}」を取り下げて手持ちに戻した。`);
    writeSave();
    renderApp();
  }

  /* ---------------------- LIVE AI DURABILITY SURVIVAL ARENA ---------------------- */
  function enterTournament(rankId) {
    const ranks = getScaledRanks(state.year);
    const rank = ranks.find(r => r.id === rankId);
    const pc = state.pcs[battleSelectedPcIdx];
    const st = evaluatePC(pc);
    if (!rank || !st.ok || st.bench < rank.minBench) return;

    AudioSys.init();
    AudioSys.se('click');

    if (!state.flags.seenFirstBattle) {
      state.flags.seenFirstBattle = true;
      writeSave();
      startAdv([
        { speaker: `次郎（${state.age}歳）`, mood: 'happy', text: '「ついに初陣だ！パソコンバトルではAI同士が極限の演算バトルを繰り広げる！」' },
        { speaker: `次郎（${state.age}歳）`, mood: 'build', text: '「1つでもパーツの耐久度が0になって破損したら即AI停止で敗退……頼むぞ、俺の相棒！」' }
      ], () => runArenaSimulation(rank, pc));
      return;
    }

    runArenaSimulation(rank, pc);
  }

  function runArenaSimulation(rank, pc) {
    inArena = true;
    document.getElementById('bottom-nav').classList.add('hidden');
    AudioSys.playBgm('arena');

    const coolerSpec = getSpec(pc.parts.cooler.specId);
    const caseSpec = getSpec(pc.parts.case.specId);
    const mitigation = Math.min(0.55, (coolerSpec.cool || 0) + (caseSpec.protect || 0));

    const rivalNames = [
      '秋葉原の黒豹', '水冷マスターK', '深夜のオーバークロッカー', '白統一の麗奈',
      'ジャンク再生師', '電脳学園エース', '爆熱ベンチマーカー', '静音主義者Z', 'AI研究所員β'
    ];
    const entrants = rivalNames.map((name, i) => {
      const [minD, maxD] = rank.rivalDurRange;
      const baseD = Math.round((minD + Math.random() * (maxD - minD)) * rank.eraFactor);
      return {
        id: `rival_${i}`,
        name,
        isJiro: false,
        hp: baseD,
        maxHp: baseD,
        alive: true,
        elimOrder: 0
      };
    });

    entrants.push({
      id: 'jiro',
      name: `次郎 (${pc.name})`,
      isJiro: true,
      alive: true,
      elimOrder: 0
    });

    let tickCount = 0;
    let elimCounter = 0;
    const battleLogs = [`🔥 ${rank.name} 開幕！全10台のAIがフルロード演算を開始！`];
    const physicalKeys = ['cpu', 'cooler', 'mobo', 'ram', 'gpu', 'ssd', 'psu', 'case'];

    function renderArenaScreen(finished = false, finalPlacement = 10, prize = 0) {
      const partBars = physicalKeys.map(k => {
        const pt = pc.parts[k];
        const sp = getSpec(pt.specId);
        const pct = Math.max(0, Math.round((pt.dur / pt.maxDur) * 100));
        const barCol = pt.dur <= 0 ? 'bg-rose-600' : pct < 30 ? 'bg-amber-400' : 'bg-emerald-400';
        return `
          <div class="bg-slate-800/90 px-2 py-1 rounded-lg border ${pt.dur <= 0 ? 'border-rose-500' : 'border-slate-700'}">
            <div class="flex justify-between text-[10px] font-bold">
              <span class="truncate">${sp.name}</span>
              <span class="${pt.dur <= 0 ? 'text-rose-400 font-black' : 'text-slate-300'}">${pt.dur}/${pt.maxDur}</span>
            </div>
            <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden mt-0.5">
              <div class="h-full ${barCol} transition-all duration-150" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      const aliveCount = entrants.filter(e => e.alive).length;
      const rivalsGrid = entrants.map(e => `
        <div class="px-2 py-1 rounded-lg text-[10px] font-black flex items-center justify-between ${e.isJiro ? 'bg-sky-900/80 border border-sky-400 text-sky-200' : e.alive ? 'bg-slate-800 text-slate-200' : 'bg-slate-900/60 text-slate-500 line-through'}">
          <span class="truncate">${e.isJiro ? '👑 ' : ''}${e.name}</span>
          <span>${e.alive ? '稼働中' : '停止'}</span>
        </div>
      `).join('');

      const main = document.getElementById('main-view');
      main.innerHTML = `
        <div class="flex-1 flex flex-col justify-between p-3 gap-2 bg-gradient-to-b from-slate-950 via-indigo-950 to-slate-950 text-slate-100 overflow-y-auto">
          <div class="flex items-center justify-between bg-slate-900/90 border border-amber-400/50 rounded-2xl px-3 py-2 anim-arena">
            <div>
              <div class="text-xs font-black text-amber-300">${rank.name}</div>
              <div class="text-[10px] text-slate-300">冷却・ケース保護軽減率: ${Math.round(mitigation * 100)}%</div>
            </div>
            <div class="text-right">
              <div class="text-xs font-black text-sky-300">残存AI: ${aliveCount} / 10台</div>
              <div class="text-[10px] text-slate-400">経過ティック: ${tickCount}</div>
            </div>
          </div>

          <div>
            <div class="text-[10px] font-black text-sky-300 mb-1">🔧 次郎マシンのパーツ耐久度（どれか1つ0で破損敗退！）</div>
            <div class="grid grid-cols-2 gap-1">
              ${partBars}
            </div>
          </div>

          <div>
            <div class="text-[10px] font-black text-slate-400 mb-1">出場マシン状況</div>
            <div class="grid grid-cols-2 gap-1">
              ${rivalsGrid}
            </div>
          </div>

          <div class="bg-slate-900/95 border border-slate-700 rounded-xl p-2 min-h-[72px] flex flex-col justify-between">
            <div class="text-[10px] text-amber-200 font-bold leading-snug">
              ${battleLogs.slice(0, 3).map(l => `<div>${l}</div>`).join('')}
            </div>
            ${finished ? `
              <button type="button" onclick="App.finishArena(${finalPlacement}, ${prize}, '${rank.id}')" class="mt-2 w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-xs shadow-lg">
                結果確定：第${finalPlacement}位（賞金 ¥${prize.toLocaleString()}）→ 次へ <span class="keycap">Enter</span>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    renderArenaScreen(false);

    arenaTimer = setInterval(() => {
      tickCount++;
      AudioSys.se('zap');

      const jiroEntrant = entrants.find(e => e.isJiro);
      if (jiroEntrant.alive) {
        for (let hit = 0; hit < 2; hit++) {
          const k = physicalKeys[Math.floor(Math.random() * physicalKeys.length)];
          const pt = pc.parts[k];
          const rawDmg = rank.stress * (0.45 + Math.random() * 0.75);
          const finalDmg = Math.max(1, Math.round(rawDmg * (1 - mitigation)));
          pt.dur = Math.max(0, pt.dur - finalDmg);
          if (pt.dur <= 0) {
            const sp = getSpec(pt.specId);
            jiroEntrant.alive = false;
            elimCounter++;
            jiroEntrant.elimOrder = elimCounter;
            AudioSys.se('break');
            FX.flash('#ef4444');
            battleLogs.unshift(`💥 悲報！次郎の「${sp.name}」が破損(耐久0)しAI停止！！`);
            break;
          }
        }
      }

      entrants.forEach(e => {
        if (e.isJiro || !e.alive) return;
        const dmg = rank.stress * (0.7 + Math.random() * 1.1);
        e.hp -= dmg;
        if (e.hp <= 0) {
          e.alive = false;
          elimCounter++;
          e.elimOrder = elimCounter;
          battleLogs.unshift(`⚡ 「${e.name}」のパーツが焼き切れAI停止！`);
        }
      });

      const aliveList = entrants.filter(e => e.alive);
      if (!jiroEntrant.alive || aliveList.length <= 1 || tickCount >= 22) {
        clearInterval(arenaTimer);
        arenaTimer = null;

        let placement = 1;
        if (jiroEntrant.alive) {
          placement = 1;
        } else {
          const betterCount = entrants.filter(e => !e.isJiro && (e.alive || e.elimOrder > jiroEntrant.elimOrder)).length;
          placement = Math.min(10, betterCount + 1);
        }

        const prize = rank.prizes[placement - 1] || 0;
        evaluatePC(pc);
        if (placement === 1) {
          AudioSys.se('win');
          FX.confetti();
          battleLogs.unshift('🏆 優勝！！次郎のAIが最後まで生き残り1位を獲得！');
        } else {
          battleLogs.unshift(`📊 決着！次郎は第${placement}位（賞金 ¥${prize.toLocaleString()}）となった！`);
        }
        renderArenaScreen(true, placement, prize);
      } else {
        renderArenaScreen(false);
      }
    }, 340);
  }

  function finishArena(placement, prize, rankId) {
    inArena = false;
    state.money += prize;
    const ranks = getScaledRanks(state.year);
    const rank = ranks.find(r => r.id === rankId);
    const firstClear = placement === 1 && !state.clearedRanks[rankId];
    if (placement === 1) {
      state.clearedRanks[rankId] = true;
    }

    addLog(`${rank.name}で第${placement}位！賞金¥${prize.toLocaleString()}を獲得。`);
    writeSave();

    if (rankId === 'S' && placement === 1) {
      triggerChampionEndingAdv();
      return;
    }

    if (firstClear) {
      startAdv([
        { speaker: `次郎（${state.age}歳）`, mood: 'happy', text: `「よっしゃあ！${rank.name}初優勝だ！！賞金¥${prize.toLocaleString()}ゲット！」` },
        { speaker: `次郎（${state.age}歳）`, mood: 'build', text: '「だが大会の負荷で各パーツの耐久度がかなり削れているな……次のランクに挑む前にしっかり点検しよう！」' }
      ], () => {
        currentTab = 'home';
        advanceWeek();
      });
      return;
    }

    currentTab = 'home';
    advanceWeek();
  }

  /* ---------------------- KEYBOARD SHORTCUTS ---------------------- */
  document.addEventListener('keydown', (e) => {
    const modalOpen = !document.getElementById('modal-backdrop').classList.contains('hidden');
    if (modalOpen) {
      if (e.key === 'Escape') closeModal();
      return;
    }

    const k = e.key.toLowerCase();
    if (k === 'm') {
      AudioSys.toggleMute();
      return;
    }

    if (!state) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (saveExists()) continueGame();
        else startNewGame();
      } else if (k === 'n') {
        startNewGame();
      } else if (e.key === 'Delete' && saveExists()) {
        confirmDeleteSave();
      }
      return;
    }

    if (advMode) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        nextAdv();
      } else if (k === 's') {
        skipAdv();
      }
      return;
    }

    if (inArena) return;

    if (['1', '2', '3', '4', '5'].includes(e.key)) {
      const map = { '1': 'home', '2': 'build', '3': 'shop', '4': 'flea', '5': 'battle' };
      setTab(map[e.key]);
    } else if (k === 'w' && currentTab === 'home') {
      manualAdvanceWeek();
    } else if (e.key === 'Escape') {
      manualSave();
    }
  });

  function boot() {
    renderTitle();
  }

  return {
    boot,
    startNewGame,
    continueGame,
    confirmDeleteSave,
    setComparePcIdx,
    setTab,
    nextAdv,
    skipAdv,
    manualAdvanceWeek,
    manualSave,
    openPcInBuilder,
    addNewPcSlot,
    selectPcSlot,
    openPartPicker,
    equipPart,
    unequipPart,
    disassemblePc,
    trashPcOrParts,
    trashCurrentPc,
    trashInventoryItem,
    selectShop,
    setShopSubMode,
    updateBtoPart,
    orderBtoPc,
    buyMarketItem,
    toggleFleaSelect,
    selectAllFleaItems,
    deselectAllFleaItems,
    updateFleaPrice,
    packPcForListing,
    restoreDisassembledPc,
    createFleaListing,
    cancelListing,
    selectBattlePc,
    enterTournament,
    finishArena
  };
})();

window.onload = () => App.boot();
</script>
</body>
